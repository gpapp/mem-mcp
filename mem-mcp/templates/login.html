<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Vault — Login</title>
    <style>
        :root { --bg: #0d1117; --fg: #c9d1d9; --primary: #58a6ff; --error: #f85149; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-box { background: #161b22; padding: 2rem; border-radius: 8px; border: 1px solid #30363d; width: 320px; }
        h1 { margin: 0 0 1.5rem; font-size: 1.25rem; color: var(--primary); }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #30363d; border-radius: 4px; background: #0d1117; color: var(--fg); box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 0.75rem; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .error { color: var(--error); font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Memory Vault</h1>
        <form id="loginForm">
            <div class="error" id="error">Invalid credentials</div>
            <label>Username</label>
            <input type="text" name="username" required autocomplete="username">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password">
            <button type="submit">Sign In</button>
        </form>
    </div>
    <script>
        const BASE_URL = "{{BASE_URL}}";
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = new FormData(e.target);
            const res = await fetch(BASE_URL + "/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: form.get("username"), password: form.get("password") })
            });
            if (res.ok) {
                window.location.href = BASE_URL + "/gui";
            } else {
                document.getElementById("error").style.display = "block";
            }
        });
    </script>
</body>
</html>
