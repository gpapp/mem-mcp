services:
  qdrant:
    # Pinned, like neo4j and ollama. backup.py depends directly on the
    # snapshot create/download/upload API, so a surprise major bump would turn
    # into an unrestorable vault rather than a visible failure. Same digest as
    # `latest` when this was pinned.
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD ' /proc/net/tcp || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
             # No ports exposed to the host network for security
    networks:
      - memory-net
    volumes:
      - ./qdrant_storage:/qdrant/storage


# Graph Database (The Relationship Mapper)
  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - memory-net
    environment:
      - NEO4J_AUTH=neo4j/${NEO_PASS}
      - NEO4J_PLUGINS=["apoc"] # Recommended for EA graph analysis
        # Force Bolt to use internal encryption if you connect via bolt+s
      - NEO4J_dbms_connector_bolt_tls__level=DISABLED
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs

  ollama:
    # Pinned, like neo4j. `latest` moves between deploys and the embed/chat
    # route surface has shifted across versions — the app now tries both
    # /api/embeddings and /api/embed, but pinning means an unexpected Ollama
    # upgrade is a deliberate change here rather than a side effect of
    # `docker-compose up -d --build`. This tag is what `latest` resolved to.
    image: ollama/ollama:0.34.4
    container_name: ollama
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2CAA ' /proc/net/tcp /proc/net/tcp6 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - memory-net
    environment:
      # Sized against the one path that is NOT windowed. The extractors all
      # send a single window (MEM_*_WINDOW are measured in chars, ~3.6 per
      # token), so a 30k-char diary entry costs ~2000 tokens per call no matter
      # how long the entry is. The merge draft is the exception: it json.dumps
      # the full text of every selected record with no cap, so its prompt is
      # max_cluster x the record length. Measured: facts average 489 chars and
      # top out at 3055 (~853 tokens), and max_cluster may be up to 20 --
      # which is already over 16332. Cutting this to 8192 moved the break point
      # from ~18 clusters to ~8, in exchange for 3 percentage points of GPU
      # residency (80% -> 83%). Not a trade worth making; if the merge path
      # ever needs a guarantee, cap it in code rather than shrinking this.
      - OLLAMA_CONTEXT_LENGTH=16332
      - OLLAMA_FLASH_ATTENTION=True
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # A cold load of the chat model measured 9-20s, paid on the first call
      # after any idle gap. 30m keeps it warm for a working session and still
      # releases it overnight -- the card is 4 GB shared with ASR (1.25 GB), so
      # holding a 3.3 GB model resident indefinitely starves the transcriber.
      - OLLAMA_KEEP_ALIVE=5m

  mem-mcp:
    build: ./mem-mcp
    container_name: mem-mcp
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - memory-net
    ports:
      - "127.0.0.1:8086:8080"      
    environment:
      - MEM_PROVIDER=ollama
      - MEM_LLM_URL=http://ollama:11434
      - LLM_QUERY_MODEL=${LLM_QUERY_MODEL}
      - MEM_SCOPE_MODEL=${MEM_SCOPE_MODEL}
      - MEM_EXTRACT_MODEL=${MEM_EXTRACT_MODEL:-${LLM_QUERY_MODEL}}
      - MEM_MERGE_MODEL=${MEM_MERGE_MODEL:-gemma4:e2b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - HTTPX_TIMEOUT=600.0
      - REQUESTS_TIMEOUT=600

      # LLM chat timeouts. Compose only passes what is listed here, so a knob
      # documented in .env.example but absent from this block is unreachable and
      # permanently stuck at its code default -- which is how MEM_LLM_TIMEOUT
      # looked configurable and was not. Defaults are repeated deliberately so
      # the effective value is visible in one place. See AGENTS.md
      # "LLM Chat Reliability".
      - MEM_LLM_TIMEOUT=${MEM_LLM_TIMEOUT:-300}
      - MEM_LLM_CONNECT_TIMEOUT=${MEM_LLM_CONNECT_TIMEOUT:-10}
      - MEM_SEARCH_LLM_TIMEOUT=${MEM_SEARCH_LLM_TIMEOUT:-45}
      - MEM_LLM_LOG_CHARS=${MEM_LLM_LOG_CHARS:-1000}

      # Search-query rewrite cache. The rewrite costs one LLM call per search
      # and its answer depends only on (query, filters, expand) -- not on the
      # vault -- so a repeat asks a question already answered. TTL 0 or MAX 0
      # disables it, which restores the pre-cache behaviour.
      - MEM_QUERY_CACHE_TTL=${MEM_QUERY_CACHE_TTL:-900}
      - MEM_QUERY_CACHE_MAX=${MEM_QUERY_CACHE_MAX:-256}

      # Server status widget. One poller in the lifespan feeds every browser
      # over SSE; it pushes only when the status fingerprint changes, so the
      # interval is how fast a freshly loaded model appears, not a refresh
      # rate. HTTP_TIMEOUT is separate from the chat budgets on purpose -- a
      # status probe must never be what makes anything else slow.
      - MEM_STATUS_POLL_SECONDS=${MEM_STATUS_POLL_SECONDS:-10}
      - MEM_STATUS_HTTP_TIMEOUT=${MEM_STATUS_HTTP_TIMEOUT:-8}
      # Empty default: no Service tab until an operator names the admin account.
      - MEM_ADMIN_USER=${MEM_ADMIN_USER:-}

      # Merge-draft budget. The only LLM call whose prompt is uncapped: it
      # json.dumps the full text of every selected record, so it is sized
      # against the context window rather than a window. There is no
      # output-budget knob on purpose: the budget is what the context leaves
      # after the prompt, because the answer scales with the selection (2,776
      # output tokens measured for 4 records, 5,657 for 12). A fixed value was
      # either too small for the largest cluster -- JSON cut off mid-object and
      # surfaced as an unexplained 502 -- or wastefully large for the smallest.
      # MIN_NUM_PREDICT is the refusal floor, not the budget: below it a draft
      # cannot complete, so the request is refused with a 400 instead of 502.
      # CONTEXT_TOKENS must stay in step with OLLAMA_CONTEXT_LENGTH above.
      # MAX_CLUSTER is measured, not guessed: at 12 records the prompt is 8,801
      # tokens, leaving 7,531 to write with against a measured 5,657.
      - MEM_MERGE_MIN_NUM_PREDICT=${MEM_MERGE_MIN_NUM_PREDICT:-3000}
      - MEM_MERGE_CONTEXT_TOKENS=${MEM_MERGE_CONTEXT_TOKENS:-16332}
      - MEM_MERGE_MAX_CLUSTER=${MEM_MERGE_MAX_CLUSTER:-12}

      # Embedding budget and retries. EMBED_MAX_CHARS must stay in step with
      # chunking.EMBED_CEILING, which reads the same variable.
      - MEM_EMBED_RETRIES=${MEM_EMBED_RETRIES:-2}
      - MEM_EMBED_RETRY_BACKOFF=${MEM_EMBED_RETRY_BACKOFF:-1.5}
      - MEM_EMBED_MAX_CHARS=${MEM_EMBED_MAX_CHARS:-8000}

      # Long records (chunking) and the startup re-chunking pass.
      - MEM_CHUNK_CHARS=${MEM_CHUNK_CHARS:-3000}
      - MEM_CHUNK_MAX=${MEM_CHUNK_MAX:-16}
      - MEM_CHUNK_OVERLAP=${MEM_CHUNK_OVERLAP:-200}
      - MEM_CHUNK_FETCH_MULTIPLIER=${MEM_CHUNK_FETCH_MULTIPLIER:-3}
      - MEM_RECHUNK_ENABLED=${MEM_RECHUNK_ENABLED:-1}
      - MEM_RECHUNK_LIMIT=${MEM_RECHUNK_LIMIT:-200}
      - MEM_RECHUNK_CONCURRENCY=${MEM_RECHUNK_CONCURRENCY:-2}

      # Text windowing. One LLM call per window, so the window size is a
      # recall/cost trade-off; the count is deliberately never capped.
      - MEM_SCOPE_TEXT_WINDOW=${MEM_SCOPE_TEXT_WINDOW:-6000}
      - MEM_SCOPE_TEXT_OVERLAP=${MEM_SCOPE_TEXT_OVERLAP:-600}
      - MEM_PEOPLE_WINDOW=${MEM_PEOPLE_WINDOW:-6000}
      - MEM_PEOPLE_OVERLAP=${MEM_PEOPLE_OVERLAP:-600}
      - MEM_PEOPLE_RESOLVE_WINDOW=${MEM_PEOPLE_RESOLVE_WINDOW:-6000}
      - MEM_PEOPLE_RESOLVE_OVERLAP=${MEM_PEOPLE_RESOLVE_OVERLAP:-600}
      - MEM_KEYWORD_WINDOW=${MEM_KEYWORD_WINDOW:-8000}
      - MEM_KEYWORD_OVERLAP=${MEM_KEYWORD_OVERLAP:-500}
      - MEM_KEYWORD_LIMIT=${MEM_KEYWORD_LIMIT:-20}

      # Graph response cap.
      - MEM_GRAPH_MAX_NODES=${MEM_GRAPH_MAX_NODES:-600}

      - MEM_EMBEDDER_PROVIDER=ollama
      - MEM_EMBEDDER_MODEL=${MEM_EMBEDDER_MODEL:-nomic-embed-text}
      - MEM_EMBEDDER_URL=http://ollama:11434
        # Vector Store (Qdrant)
      - MEM_VECTOR_STORE_PROVIDER=qdrant
      - MEM_QDRANT_URL=http://qdrant:6333

        # Graph Store (Neo4j)
      - MEM_ENABLE_GRAPH=true
      - MEM_NEO4J_URL=bolt://neo4j:7687
      - MEM_NEO4J_USER=neo4j
      - MEM_NEO4J_PASSWORD=${NEO_PASS}
      - MEM_SESSION_SECRET=${MEM_SESSION_SECRET}
      - BASE_URL=${BASE_URL}

        # Sessions and MCP access keys. MEM_SESSION_DIR must point at the
        # bind mount below, not at the container filesystem: a rebuild replaces
        # the container, and a session that lived inside it would log everyone
        # out on every deploy.
      - MEM_SESSION_DIR=/app/sessions
      - MEM_SESSION_SECURE=${MEM_SESSION_SECURE:-0}
      - HTPASSWD_PATH=/app/htpasswd

      # Self-service registration. Off by default: it opens unauthenticated POST
      # endpoints that each create a vault. The landing page offers each method
      # only once it is actually usable -- username+password needs the SMTP block,
      # Google needs both client credentials -- so a half-configured deployment
      # does not offer a signup it cannot complete. Throttled per client address
      # in-process; that stops a script, not a botnet, so a real deployment wants
      # a rate limit in the proxy too. Turning it off does not lock out anyone
      # who already has an account: Google sign-in works regardless.
      - MEM_REGISTRATION_ENABLED=${MEM_REGISTRATION_ENABLED:-0}

        # Google sign-in. Optional; both values must be set for the landing page
        # to offer "Continue with Google". The redirect URI to register with
        # Google is {{BASE_URL}}/api/auth/google/callback.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

        # Outbound mail, for the registration confirmation link. HOST and FROM
        # are the two that must be set before the username+password form is even
        # rendered.
      - MEM_SMTP_HOST=${MEM_SMTP_HOST:-}
      - MEM_SMTP_PORT=${MEM_SMTP_PORT:-587}
      - MEM_SMTP_USER=${MEM_SMTP_USER:-}
      - MEM_SMTP_PASSWORD=${MEM_SMTP_PASSWORD:-}
      - MEM_SMTP_FROM=${MEM_SMTP_FROM:-}
      - MEM_SMTP_STARTTLS=${MEM_SMTP_STARTTLS:-1}
      - MEM_SMTP_TIMEOUT=${MEM_SMTP_TIMEOUT:-20}

        # Daily savepoints (Setup → Maintenance → Backup & Restore)
      - MEM_BACKUP_ENABLED=${MEM_BACKUP_ENABLED:-1}
      - MEM_BACKUP_HOUR=${MEM_BACKUP_HOUR:-3}
      - MEM_BACKUP_MINUTES=${MEM_BACKUP_MINUTES:-0}
      - MEM_BACKUP_KEEP=${MEM_BACKUP_KEEP:-14}

    volumes:
      - MEM_model_cache:/root/.cache/fastembed
      - ./mem-mcp-data/logs:/app/logs
      - ./mem-mcp-data/backup:/app/backup
      - ./mem-mcp-data/htpasswd:/app/htpasswd:ro
      - ./mem-mcp-data/sessions:/app/sessions

volumes:
  MEM_model_cache:

networks:
  memory-net:
    driver: bridge
