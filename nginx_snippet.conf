# Memory Vault - nginx config (mounted at /mcp)
# 1. /mcp/mcp/ → MCP server with Basic Auth
# 2. /mcp/ → GUI with form-based session auth (no nginx auth)

# MCP Server (Basic Auth required by nginx)
location /mcp/mcp/ {
        auth_basic "Architectural Tool Vault";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://localhost:8086/mcp/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Remote-User $remote_user;
}

# GUI and API (session auth by app, no nginx auth)
location /mcp/ {
        proxy_pass http://localhost:8086/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Cookie $http_cookie;
}