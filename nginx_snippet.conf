# 3. Memory Vault MCP Server (HTTP Transport)
# This location strips the /mcp/ prefix and forwards to the container root.
# The server must be started with BASE_URL=https://<host>/mcp so that
# uvicorn sets root_path=/mcp.
# Client config: claude mcp add --transport http memory-vault https://<host>/mcp
location /mcp/ {
        auth_basic "Architectural Tool Vault";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://localhost:8086/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Remote-User $remote_user;
}