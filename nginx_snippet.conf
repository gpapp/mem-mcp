# Memory Vault - nginx config (mounted at /mem-mcp)
# 1. /mem-mcp/mcp/ → MCP server, authenticated by the app
# 2. /mem-mcp/api/live/stream/ → live transcription audio (WebSocket upgrade)
# 3. /mem-mcp/ → GUI with form-based session auth (no nginx auth)
#
# The `auth_basic` block that used to sit on the MCP location is gone, and that
# is required rather than cosmetic: nginx can only check a username and
# password against a file on the host, so it rejects an
# `Authorization: Bearer mvk_…` before the request is ever forwarded and the
# app never sees the access key. McpAuthGuard (gui.py) now does the check and
# accepts a dashboard session, Basic auth against the app's own htpasswd, or an
# access key — which also means a key can be revoked from Setup → Access Keys
# without editing anything here.
#
# If you re-add auth_basic, PSK support stops working. Do not.

# MCP Server (authenticated by the app)
location /mem-mcp/mcp {
        proxy_pass http://localhost:8086/mcp;
        proxy_redirect off;
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        # $remote_user is now empty (nothing sets it), so this header is not
        # forwarded. McpAuthGuard stamps the verified identity itself.
}

# Live transcription audio (WebSocket).
#
# This location exists because a WebSocket handshake is an HTTP GET carrying
# `Connection: Upgrade` and `Upgrade: websocket`, and nginx treats both as
# hop-by-hop headers: unless they are set explicitly it *strips* them, and the
# app receives an ordinary GET. That request matches no WebSocketRoute, falls
# through to the catch-all MCP mount, and is answered with a 401 naming an
# access key -- so the browser reports that recording could not start and
# nothing in the log mentions the proxy. The app now answers that GET with a
# 426 that names this requirement; this block is what stops it being asked.
#
# Prefix matching picks the longest match, so this wins over `/mem-mcp/`
# without any ordering requirement.
location /mem-mcp/api/live/stream/ {
        proxy_pass http://localhost:8086/api/live/stream/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
}

# GUI and API (session auth by app, no nginx auth)
location /mem-mcp/ {
        proxy_pass http://localhost:8086/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Cookie $http_cookie;
}